[pytest]
# Run from backend/ — the same import root uvicorn and alembic use, so tests
# import `db.*` / `graph.*` exactly the way the app does (no `backend.` prefix).
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
