# Alembic config for the AlphaDesk backend.
#
# Run from inside backend/ (same rule as uvicorn — `backend/` is the import
# root, there is no `backend.` package prefix):
#
#     cd backend && alembic upgrade head
#
# There is deliberately NO sqlalchemy.url here. alembic/env.py reads
# DATABASE_URL from the environment (backend/.env is loaded if present) and
# normalises it to the asyncpg driver, so the app and migrations can never
# drift onto different databases. Override for a one-off with:
#
#     alembic -x db_url=postgresql+asyncpg://... upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
